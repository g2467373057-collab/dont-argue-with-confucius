<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171310">
  <title>哲学思辨语音房 · 别和孔子抬杠</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/game.css">
</head>
<body class="page-game">
  <div id="gameBg" class="game-bg"></div>

  <div class="game-shell">
    <header class="game-topbar">
      <button id="btnBack" class="icon-btn" type="button" aria-label="返回首页">‹</button>
      <div class="topbar-title">
        <h1 id="chapterTitle">第一章 · 己欲立而立人</h1>
        <p id="chapterStatus">第 1 / 10 章</p>
      </div>
      <button id="btnChapters" class="icon-btn icon-btn-text" type="button" aria-label="章节目录">目录</button>
    </header>

    <main class="game-main">
      <!-- 思辨语音房：进入游戏后直接在场 -->
      <section id="discussionStage" class="stage discussion-stage">
        <div class="room-grid">
          <div id="leftCol" class="side-col"></div>
          <div class="center-col">
            <div class="user-seat">
              <div class="seat-avatar-wrap user-avatar-wrap">
                <img id="userAvatar" class="seat-avatar user-avatar" alt="我的头像">
                <span class="seat-ring"></span>
              </div>
              <p id="userName" class="seat-name user-name">玩家</p>
              <p class="seat-school">我</p>
            </div>
            <div id="turnBadge" class="turn-badge hidden">轮到你了，请发言</div>
          </div>
          <div id="rightCol" class="side-col"></div>
        </div>

        <div id="speechLayer" class="speech-layer hidden">
          <div class="speech-bubble">
            <div class="speech-head">
              <img id="speechAvatar" class="speech-avatar" alt="">
              <p id="speechName" class="speech-name"></p>
            </div>
            <p id="speechText" class="speech-text"></p>
          </div>
        </div>

        <div id="playerInputBar" class="player-input hidden">
          <textarea id="playerReply" class="field reply-input" rows="2" maxlength="200" placeholder="说出你的观点，200 字以内…"></textarea>
          <button id="btnVoice" class="voice-btn" type="button" title="语音发言（原型占位）">🎤</button>
          <button id="btnSpeak" class="btn btn-primary speak-btn" type="button">发言</button>
        </div>
      </section>

      <!-- 语音房内故事观看浮层：看完视频 + 小故事，大家就绪后才解锁讨论 -->
      <section id="storyPanel" class="story-panel" aria-label="本章小故事">
        <div class="story-panel-card">
          <div class="video-frame">
            <video id="storyVideo" class="hidden" playsinline preload="metadata"></video>
            <div id="videoPlaceholder" class="video-placeholder">
              <button id="btnPlayVideo" class="btn-play" type="button">
                <span class="play-triangle">▶</span>
              </button>
              <p class="video-placeholder-title">第 <span id="videoChapterNo">一</span> 章 · 小故事</p>
              <p class="video-placeholder-tip">尚未放入视频素材，点击以演示模式播放</p>
            </div>
            <div class="video-progress"><i id="videoProgressFill"></i></div>
            <div id="videoHint" class="video-hint">观看视频后开始思辨</div>
          </div>

          <article class="story-card">
            <h2 id="storyQuote" class="story-quote">“己欲立而立人，己欲达而达人。”</h2>
            <p id="storySource" class="story-source">《论语·学而》</p>
            <p id="storySynopsis" class="story-synopsis"></p>
            <p id="storyQuestion" class="story-question"></p>
          </article>
        </div>
      </section>
    </main>

    <footer class="game-footer">
      <button id="btnTranscript" class="footer-btn" type="button">聊天记录</button>
      <div id="chapterDots" class="chapter-dots"></div>
      <button id="btnSound" class="footer-btn" type="button" title="音效开关">🔊</button>
    </footer>
  </div>

  <!-- 章节目录 -->
  <div id="chapterModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="章节目录">
    <div class="modal">
      <div class="modal-head">
        <h2 class="modal-title">章节目录</h2>
        <button id="btnCloseChapters" class="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <div id="chapterList" class="chapter-list"></div>
    </div>
  </div>

  <!-- 退出确认 -->
  <div id="restartModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="重新开始">
    <div class="modal">
      <div class="modal-head">
        <h2 class="modal-title">是否重新开始？</h2>
        <button id="btnCloseRestart" class="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <p class="modal-body-text">重新开始将清空当前游戏进度并返回首页，确定吗？</p>
      <div class="modal-foot">
        <button id="btnRestartCancel" class="btn btn-ghost-dark" type="button">取消</button>
        <button id="btnRestartConfirm" class="btn btn-danger" type="button">重新开始</button>
      </div>
    </div>
  </div>

  <!-- 章节完成 -->
  <div id="completeModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="章节完成">
    <div class="modal modal-center">
      <div class="complete-icon">✓</div>
      <h2 id="completeTitle" class="complete-title">本章完成</h2>
      <p id="completeText" class="modal-body-text"></p>
      <div class="modal-foot">
        <button id="btnCompleteNext" class="btn btn-primary btn-block" type="button">进入下一章</button>
      </div>
    </div>
  </div>

  <!-- 聊天记录 -->
  <div id="transcriptModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="聊天记录">
    <div class="modal">
      <div class="modal-head">
        <h2 class="modal-title">本回合聊天记录</h2>
        <button id="btnCloseTranscript" class="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <div id="transcriptList" class="transcript-list"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="../js/assets.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/game.js"></script>
</body>
</html>
