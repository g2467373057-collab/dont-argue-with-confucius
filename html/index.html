<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c1712">
  <title>别和孔子抬杠—哲学思辨语音房，寻找你的哲学人格</title>
  <meta name="description" content="别和孔子抬杠：在十二位哲学家的语音房里思辨十则《论语》故事，寻找你的哲学人格。">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/home.css">
</head>
<body class="page-home">
  <main id="homeBg" class="home-bg"></main>
  <div class="home-overlay"></div>

  <section class="home-content">
    <p class="home-tagline">十则《论语》思辨 · 十二哲学人格 · 遇见你的本命人格</p>
    <div class="home-actions">
      <p id="userStatus" class="user-status"></p>
      <button id="btnStart" class="btn btn-primary btn-start" type="button">开 始 游 戏</button>
      <div class="login-icons">
        <button id="btnWechatLogin" class="icon-login icon-wechat" type="button" aria-label="微信登录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10c3.038 0 5.5 2.015 5.5 4.5c0 1.397 -.778 2.645 -2 3.47l0 2.03l-1.964 -1.178a6.649 6.649 0 0 1 -1.536 .178c-3.038 0 -5.5 -2.015 -5.5 -4.5s2.462 -4.5 5.5 -4.5z"/><path d="M11.197 15.698c-.69 .196 -1.43 .302 -2.197 .302a8.008 8.008 0 0 1 -2.612 -.432l-2.388 1.432v-2.801c-1.237 -1.082 -2 -2.564 -2 -4.199c0 -3.314 3.134 -6 7 -6c3.782 0 6.863 2.57 7 5.785l0 .233"/><path d="M10 8h.01"/><path d="M7 8h.01"/><path d="M15 14h.01"/><path d="M18 14h.01"/></svg>
          <span>微信</span>
        </button>
        <button id="btnPhoneLogin" class="icon-login icon-phone" type="button" aria-label="手机号登录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/></svg>
          <span>手机号</span>
        </button>
        <button id="btnGuest" class="icon-login icon-guest" type="button" aria-label="游客模式">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></svg>
          <span>游客</span>
        </button>
      </div>
      <button id="btnRules" class="btn-link" type="button">查看游戏规则</button>
    </div>
  </section>

  <!-- 登录弹窗 -->
  <div id="loginModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="登录">
    <div class="modal">
      <div class="modal-head">
        <h2 class="modal-title">登录</h2>
        <button id="btnCloseLogin" class="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="login-tabs">
        <button id="tabWechat" class="login-tab active" type="button">微信登录</button>
        <button id="tabPhone" class="login-tab" type="button">手机号登录</button>
      </div>

      <div id="wechatPanel" class="login-panel">
        <p class="login-tip">前端原型阶段为模拟登录，后续可接入微信开放平台。</p>
        <button id="btnWechatMock" class="btn btn-primary btn-block" type="button">微信一键登录</button>
      </div>

      <div id="phonePanel" class="login-panel hidden">
        <input id="phoneInput" class="field" type="tel" maxlength="11" inputmode="numeric" placeholder="请输入手机号">
        <div class="code-row">
          <input id="codeInput" class="field" type="text" maxlength="6" inputmode="numeric" placeholder="验证码">
          <button id="btnSendCode" class="btn-code" type="button">获取验证码</button>
        </div>
        <button id="btnPhoneSubmit" class="btn btn-primary btn-block" type="button">登录并开始游戏</button>
      </div>

    </div>
  </div>

  <!-- 规则弹窗 -->
  <div id="rulesModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="游戏规则">
    <div class="modal">
      <div class="modal-head">
        <h2 class="modal-title">游戏规则</h2>
        <button id="btnCloseRules" class="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <ol class="rules-list">
        <li>游戏共 10 个《论语》小故事章节，需逐章解锁。</li>
        <li>每章先观看小故事视频，之后进入思辨环节。</li>
        <li>思辨环节中，哲学家们会按各自学派随机发言，轮到你时请说出你的观点。</li>
        <li>完成全部 10 章后，系统将根据你的发言生成哲学人格报告。</li>
        <li>每个哲学人格对应一位哲学家，报告中包含思想占比等量化数据。</li>
      </ol>
      <div class="modal-foot">
        <button id="btnRulesOk" class="btn btn-primary" type="button">知道了</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="../js/assets.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/home.js"></script>
</body>
</html>
